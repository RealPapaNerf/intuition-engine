<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will It Break</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4efe4;
      color: #2b2620;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
    }
    h1 { margin: 4px 0 0; font-size: 1.3rem; }
    p.sub { margin: 0; color: #6b6354; font-size: 0.9rem; text-align: center; }
    canvas { background: #dff0f7; border-radius: 10px; max-width: 100%; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button {
      font: inherit;
      padding: 8px 14px;
      border: 1px solid #b8ab8f;
      border-radius: 8px;
      background: #fffdf7;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .stats { display: flex; gap: 18px; font-size: 0.95rem; }
    .stats b { font-variant-numeric: tabular-nums; }
    #msg { min-height: 1.2em; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Will It Break? 🐸🐜</h1>
  <p class="sub">
    The ants built a bridge. A frog wants to cross.<br />
    <strong>Say it before you see it</strong> — then physics decides.
  </p>
  <canvas id="canvas" width="860" height="560"></canvas>
  <div class="row">
    <button id="smaller">Smaller frog</button>
    <button id="bigger">Bigger frog</button>
    <button id="holds">It HOLDS 💪</button>
    <button id="breaks">It BREAKS 💥</button>
    <button id="shed">Shed the lazy ants</button>
    <button id="reset">New round</button>
  </div>
  <div class="stats">
    <span>Frog: <b id="frog">Hopper (50 g)</b></span>
    <span>Ants on the job: <b id="working">0</b></span>
    <span>Back in the jar: <b id="freed">0</b></span>
    <span>Hardest ant: <b id="maxu">0%</b></span>
    <span>Your calls: <b id="calib">—</b></span>
  </div>
  <div id="msg"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
